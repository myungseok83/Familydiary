/* ---------- \uc800\uc7a5\uc18c ---------- */
function lsGet(k, d){ try{ const v = localStorage.getItem('gd_'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }

/* ---------- \uc11c\ubc84 \ud638\ucd9c ---------- */
// Apps Script \uc548\uc5d0\uc11c \uc5f4\uba74 google.script.run, GitHub \ub4f1 \ubc14\uae65\uc5d0\uc11c \uc5f4\uba74 API \uc8fc\uc18c\ub85c fetch
const IN_GAS = !!(window.google && google.script && google.script.run);
function apiUrl(){ return (window.API_URL || lsGet('apiUrl', '') || '').trim(); }
async function call(fn, ...args){
  if (IN_GAS){
    return new Promise((res, rej) => {
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
    });
  }
  const url = apiUrl();
  if (!url) throw new Error('NO_API');
  let r;
  try {
    r = await fetch(url, { method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },        // text/plain: \uc0ac\uc804\ud655\uc778(CORS) \uc5c6\uc774 \ubc14\ub85c \uc804\uc1a1
      body: JSON.stringify({ fn, args }) });
  } catch(e){ throw new Error('\uc11c\ubc84 \uc5f0\uacb0 \uc2e4\ud328 (\uc778\ud130\ub137 \uc5f0\uacb0 \ub610\ub294 \ubc30\ud3ec \uc124\uc815 \ud655\uc778): ' + e.message); }
  let j;
  try { j = await r.json(); }
  catch(e){ throw new Error('\uc11c\ubc84 \uc751\ub2f5 \uc624\ub958 (' + r.status + ') \u2014 \ubc30\ud3ec \uc561\uc138\uc2a4\uac00 "\ubaa8\ub4e0 \uc0ac\uc6a9\uc790"\uc778\uc9c0, Code.gs\uac00 v' + APP_VERSION + '\uc778\uc9c0 \ud655\uc778'); }
  if (!j.ok) throw new Error(j.error || '\uc11c\ubc84 \uc624\ub958');
  return j.result;
}
const api = (fn, ...args) => call(fn, S.pw, ...args);
function busy(on, msg){ document.getElementById('loading').classList.toggle('hidden', !on); const m = document.getElementById('loadMsg'); if (m) m.innerHTML = on && msg ? msg : ''; }
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function showErr(where, e){
  const box = $('errBox'); box.classList.remove('hidden');
  if (!box.innerHTML) box.innerHTML = '<button class="x" onclick="window.__errSeen={};this.parentNode.classList.add(\'hidden\');this.parentNode.innerHTML=\'\'">\u2715</button><b>\u26a0\ufe0f \uc624\ub958\uac00 \ub0ac\uc5b4\uc694 (v' + APP_VERSION + ') \u2014 \uc774 \ud654\uba74\uc744 \ucea1\ucc98\ud574\uc11c \ubcf4\ub0b4\uc8fc\uc138\uc694</b>';
  const key = where + '|' + (typeof e === 'string' ? e : errMsg(e));
  window.__errSeen = window.__errSeen || {};
  if (window.__errSeen[key]) return; window.__errSeen[key] = 1;
  const d = document.createElement('div'); if (typeof e === 'string' && where === 'HTML_CODE') d.innerHTML = '\u2022 ' + e; else d.textContent = '\u2022 ' + where + ' : ' + (typeof e === 'string' ? e : errMsg(e));
  box.appendChild(d);
}
window.showErr = showErr;
window.addEventListener('unhandledrejection', ev => showErr('\ucc98\ub9ac \uc548 \ub41c \uc624\ub958', ev.reason));
function errMsg(e){ const m = (e && e.message) || String(e); return m.replace(/^Error:\s*/, ''); }

/* ---------- \ub3c4\uad6c ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function userOf(email){ return S.users.find(u => u.email === email) || { name: (email||'?').split('@')[0], email }; }
function nameOf(email){ return userOf(email).name; }
function dayDiff(birth, dateStr){ return Math.round((Date.parse(dateStr.slice(0,10)) - Date.parse(birth)) / 86400000); }
function todayStr(){ const d = new Date(Date.now() + 9*3600000); return d.toISOString().slice(0,10); }
function fmtDate(t){
  if (!t) return '';
  const d = new Date(t.slice(0,10) + 'T00:00:00');
  return t.slice(0,10).replace(/-/g,'.') + ' (' + '\uc77c\uc6d4\ud654\uc218\ubaa9\uae08\ud1a0'[d.getDay()] + ')';
}
function ageText(days){
  if (days < 0) return '';
  const m = Math.floor(days / 30.4375);
  if (m < 24) return m + '\uac1c\uc6d4';
  return Math.floor(m/12) + '\uc138 ' + (m%12) + '\uac1c\uc6d4';
}
function avatarHtml(email, size){
  const u = userOf(email);
  const st = size ? `style="width:${size}px;height:${size}px;font-size:${Math.round(size/2.6)}px"` : '';
  if (u.avatar) return `<span class="av" ${st}><img data-ref='${esc(JSON.stringify(u.avatar))}' alt=""></span>`;
  return `<span class="av" ${st}>${esc((u.name||'?').slice(0,1))}</span>`;

/* ---------- \uc774\ubbf8\uc9c0 \ubd88\ub7ec\uc624\uae30 (\ub4dc\ub77c\uc774\ube0c \uc9c1\uc811 \u2192 \uc2e4\ud328 \uc2dc \uc11c\ubc84 \uacbd\uc720) ---------- */
const imgCache = new Map();
let imgQueue = [], imgActive = 0;
function pumpImg(){
  while (imgActive < 4 && imgQueue.length){
    const job = imgQueue.shift(); imgActive++;
    api('getImage', job.ref, job.size || 1000).then(d => job.done(d)).catch(() => job.done(''))
      .finally(() => { imgActive--; pumpImg(); });
  }
}
function viaServer(ref, size){
  const key = (ref.id || ref.path) + (size && size !== 1000 ? '@' + size : '');
  if (imgCache.has(key)) return Promise.resolve(imgCache.get(key));
  return new Promise(res => { imgQueue.push({ ref, size, done: d => { if (d) imgCache.set(key, d); res(d); } }); pumpImg(); });
}
function loadImg(el){
  if (el.dataset.loaded) return; el.dataset.loaded = '1';
  let ref; try { ref = JSON.parse(el.dataset.ref); } catch(e){ return; }
  const size = Number(el.dataset.size) || 1000;
  const key = (ref.id || ref.path) + (size !== 1000 ? '@' + size : '');
  const ok = () => el.classList.add('ok');
  if (imgCache.has(key)) { el.onload = ok; el.src = imgCache.get(key); return; }
  const fallback = () => viaServer(ref, size).then(d => { if (d) { el.onload = ok; el.src = d; } });
  if (ref.id && !S.noDirect){
    el.onerror = () => { el.onerror = null; fallback(); };
    el.onload = () => { imgCache.set(key, el.src); ok(); };
    el.src = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(ref.id) + '&sz=w' + size;
  } else fallback();
}
const io = ('IntersectionObserver' in window) ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); loadImg(e.target); } });
}, { rootMargin: '300px' }) : null;
function hydrate(root){
  (root || document).querySelectorAll('img[data-ref]:not([data-loaded])').forEach(el => io ? io.observe(el) : loadImg(el));
}

/* \uc5c5\ub85c\ub4dc\uc6a9 \uc0ac\uc9c4 \uc904\uc774\uae30 (\uae34 \ubcc0 1600px JPEG) */
function shrink(file, max = 1600){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

async function loadInit(){

async function ntfyTargets(){

  return fetch(server.replace(/\/+$/, '') + '/' + encodeURIComponent(topic) + '?' + q.join('&'),
    { method: 'POST', body: String(message || ' ') });

  } catch(e){}
}

/* \uae00\uc4f0\uae30 / \uc218\uc815 \u2014 \uc0ac\uc9c4\u00b7\ub3d9\uc601\uc0c1 \uc5ec\ub7ec \uac1c
   \u00b7 \uc0c8 \uc77c\uae30: \uc0ac\uc9c4 \uc55e 5\uc7a5\uc740 \uac8c\uc2dc\ud310 \uc0ac\uc9c4\uce78, \ub098\uba38\uc9c0 \uc0ac\uc9c4\u00b7\ub3d9\uc601\uc0c1\uc740 'Multi file upload'\uc5d0 \uc5f0\uacb0
   \u00b7 \uc218\uc815 / \uc0c1\uc138\ud654\uba74 \ucd94\uac00: \ubaa8\ub450 'Multi file upload'\uc5d0 \uc5f0\uacb0 */
const MAX_PHOTOS = 50, MAX_VIDEOS = 10, MAX_VIDEO_MB = 100;
// \ud30c\uc77c \uc885\ub958 \ud310\ubcc4 (\ud3f0\uc5d0 \ub530\ub77c type \uc774 \ube44\uc5b4 \uc788\ub294 \uacbd\uc6b0\uac00 \uc788\uc5b4 \ud655\uc7a5\uc790\ub3c4 \ud655\uc778)
function kindOf(f){
  const t = (f.type || '').toLowerCase(), ext = (f.name.split('.').pop() || '').toLowerCase();
  if (t.startsWith('video/') || /^(mp4|mov|m4v|3gp|3g2|webm|mkv|avi|wmv|mts|m2ts|hevc)$/.test(ext)) return 'video';
  if (t.startsWith('image/') || /^(jpe?g|png|gif|webp|heic|heif|bmp)$/.test(ext)) return 'photo';
  return '';
}
// \uace0\ub978 \ud30c\uc77c \uc815\ub9ac: \uc885\ub958\ubcc4\ub85c \ub098\ub204\uace0, \ube60\uc9c0\ub294 \ud30c\uc77c\uc740 \ud655\uc2e4\ud788 \uc54c\ub824\uc90c
function sortPicked(files){
  const out = [], skipped = [];
  files.forEach(f => {
    const k = kindOf(f);
    if (!k) skipped.push(f.name + ' (\uc0ac\uc9c4\u00b7\ub3d9\uc601\uc0c1\uc774 \uc544\ub2d8)');
    else if (!f.size) skipped.push(f.name + ' (\ube48 \ud30c\uc77c \u2014 \ud3f0\uc5d0 \uc544\uc9c1 \ub0b4\ub824\ubc1b\uc9c0 \uc54a\uc740 \ud074\ub77c\uc6b0\ub4dc \ud30c\uc77c\uc77c \uc218 \uc788\uc5b4\uc694)');
    else if (k === 'video' && f.size > MAX_VIDEO_MB*1024*1024) skipped.push(f.name + ' (' + fmtSize(f.size) + ' \u2014 100MB \ucd08\uacfc)');
    else out.push({ file: f, kind: k });
  });
  if (skipped.length) alert('\uc544\ub798 \ud30c\uc77c\uc740 \uc62c\ub9b4 \uc218 \uc5c6\uc5b4\uc11c \ube90\uc5b4\uc694:\n\n' + skipped.join('\n'));
  return out;
}

    list.slice(0, Math.max(0, max - have)).forEach(x => wFiles.push({ file: x.file, kind: k, url: URL.createObjectURL(x.file) }));
  });
  renderWThumbs();
}

/* \ud070 \ud30c\uc77c \uc5c5\ub85c\ub4dc (\ucc44\ud305\u00b7\uc77c\uae30 \uacf5\uc6a9) \u2192 \ub4dc\ub77c\uc774\ube0c \ud30c\uc77c ID
   \u2460 \ube60\ub978 \ubc29\uc2dd: \ud3f0 \u2192 \uad6c\uae00 \ub4dc\ub77c\uc774\ube0c \uc9c1\uc811 (\uc11c\ubc84\ub294 \uc5c5\ub85c\ub4dc \uc8fc\uc18c\ub9cc \ub9cc\ub4e4\uc5b4 \uc90c)
   \u2461 \uc548 \ub418\uba74 \uc790\ub3d9\uc73c\ub85c \uc11c\ubc84 \uacbd\uc720 \ubc29\uc2dd(3MB \uc870\uac01)\uc73c\ub85c \ub2e4\uc2dc \uc62c\ub9bc */
S.direct = null;          // null: \uc544\uc9c1 \ubaa8\ub984, true: \uc9c1\uc811 \uc5c5\ub85c\ub4dc \ub428, false: \uc548 \ub428(\uc11c\ubc84 \uacbd\uc720)
function putDirect(url, f, onPct){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url, true);
    x.upload.onprogress = e => { if (e.lengthComputable && onPct) onPct(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => {
      if (x.status === 200 || x.status === 201){
        try { const j = JSON.parse(x.responseText); if (j.id) return res(j.id); } catch(e){}
      }
      rej(new Error('\uc9c1\uc811 \uc5c5\ub85c\ub4dc \uc2e4\ud328 (' + x.status + ')'));
    };
    x.onerror = () => rej(new Error('\uc9c1\uc811 \uc5c5\ub85c\ub4dc \uc5f0\uacb0 \uc548 \ub428'));
    x.send(f);
  });
}
async function uploadRelay(f, target, onPct){
  const url = await api('startUpload', f.name, f.type || 'application/octet-stream', f.size, target || '', '');
  const KB256 = 256 * 1024;
  let CH = (IN_GAS ? 12 : 32) * KB256;       // Apps Script \uc548 3MB / GitHub 8MB (\ub108\ubb34 \ud06c\uba74 'HTTP 0' \uc624\ub958)
  let r = { done: false }, st = 0, tries = 0;
  while (st < f.size){
    const end = Math.min(st + CH, f.size);
    const b64 = await readB64(f.slice(st, end));
    try {
      r = await api('uploadChunk', url, b64, st, f.size);
      st = end; tries = 0;
      if (onPct) onPct(Math.round(st / f.size * 100));
    } catch(e){
      tries++;
      const small = (IN_GAS ? 4 : 8) * KB256;
      if (CH > small){ CH = small; tries = 0; continue; }          // 1~2MB\ub85c \uc904\uc5ec\uc11c \ub2e4\uc2dc
      if (tries >= 4) throw e;
      await new Promise(z => setTimeout(z, 2000 * tries));
    }
  }
  if (!r.done || !r.id) throw new Error('\uc5c5\ub85c\ub4dc\uac00 \ub05d\ub098\uc9c0 \uc54a\uc558\uc5b4\uc694');
  return r.id;
}
async function uploadBig(f, target, onPct){
  if (S.direct !== false){
    try {
      const url = await api('startUpload', f.name, f.type || 'application/octet-stream', f.size, target || '', location.origin);
      const id = await putDirect(url, f, onPct);
      S.direct = true;
      return id;
    } catch(e){
      if (S.direct === true) throw e;          // \uc798 \ub418\ub358 \uc911 \uc2e4\ud328 \u2192 \uc9c4\uc9dc \uc624\ub958 (\ub124\ud2b8\uc6cc\ud06c \ub4f1)
      S.direct = false;                        // \uc774 \ud658\uacbd\uc740 \uc9c1\uc811 \uc5c5\ub85c\ub4dc \ubd88\uac00 \u2192 \uc774\ud6c4 \uc11c\ubc84 \uacbd\uc720
      if (onPct) onPct(0);
    }
  }
  return uploadRelay(f, target, onPct);
}
// \ub3d9\uc2dc\uc5d0 n\uac1c\uc529 \ucc98\ub9ac
async function runPool(items, n, worker){
  let next = 0;
  const lane = async () => { while (next < items.length){ const k = next++; await worker(items[k], k); } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, lane));
}
/* \uc77c\uae30\uc5d0 \uc0ac\uc9c4\u00b7\ub3d9\uc601\uc0c1 \uc62c\ub9ac\uae30 (\ub3d9\uc2dc\uc5d0 3\uac1c\uc529, \uc9c4\ud589\ub960 \ud45c\uc2dc) \u2192 \uc2e4\ud328 \uac1c\uc218 */
async function uploadToPost(postId, files, notifyAfter, original){
  const photos = files.filter(f => f.kind === 'photo'), videos = files.filter(f => f.kind === 'video');
  let fail = 0;
  // \u2460 \uc904\uc778 \uc0ac\uc9c4: 5\uc7a5\uc529 \ubb36\uc5b4\uc11c, 2\ubb36\uc74c \ub3d9\uc2dc\uc5d0
  if (!original && photos.length){
    const groups = []; for (let i = 0; i < photos.length; i += 5) groups.push(photos.slice(i, i + 5));
    let sent = 0;
    await runPool(groups, 2, async g => {
      const batch = [];
      for (const f of g){ try { batch.push(await shrink(f.file, 2000)); } catch(e){ fail++; } }
      if (!batch.length) return;
      try { await api('addMedia', S.me, postId, batch); sent += batch.length; }
      catch(e){ fail += batch.length; showErr('\uc0ac\uc9c4 \uc62c\ub9ac\uae30', e); }
      busy(true, `\uc0ac\uc9c4 \uc62c\ub9ac\ub294 \uc911 ${sent}/${photos.length}`);
    });
  }
  // \u2461 \uc6d0\ubcf8 \uc0ac\uc9c4 + \ub3d9\uc601\uc0c1: 3\uac1c\uc529 \ub3d9\uc2dc\uc5d0
  const big = (original ? photos : []).concat(videos);
  if (big.length){
    const total = big.reduce((a, b) => a + b.file.size, 0) || 1;
    const loaded = big.map(() => 0);
    let done = 0;
    const show = () => busy(true, `\uc62c\ub9ac\ub294 \uc911 ${done}/${big.length} \u00b7 ${Math.round(loaded.reduce((a, b) => a + b, 0) / total * 100)}%`
      + `<br><small>${fmtSize(total)}${S.direct === true ? ' \u00b7 \u26a1 \ube60\ub978 \uc5c5\ub85c\ub4dc' : S.direct === false ? ' \u00b7 \uc77c\ubc18 \uc5c5\ub85c\ub4dc' : ''}</small>`);
    show();
    await runPool(big, 3, async (it, k) => {
      try {
        const id = await uploadBig(it.file, 'media', pct => { loaded[k] = it.file.size * pct / 100; show(); });
        await api('registerMedia', S.me, postId, [id]);
        loaded[k] = it.file.size; done++; show();
      } catch(e){ fail++; showErr((it.kind === 'video' ? '\ub3d9\uc601\uc0c1' : '\uc0ac\uc9c4') + ' \uc62c\ub9ac\uae30 (' + it.file.name + ')', e); }
    });
  }
  if (notifyAfter && (photos.length || videos.length)){
    const post = S.posts.find(x => x.id === postId);
    notifyFamily('\ud83d\uddbc\ufe0f ' + nameOf(S.me) + '\ub2d8\uc774 ' + countText(photos.length, videos.length) + '\uc744 \ucd94\uac00\ud588\uc5b4\uc694', post ? post.title : '', 'frame_with_picture');
  }
  S.media = null; S.mediaP = null;           // \uc568\ubc94\u00b7\uc0c1\uc138\ud654\uba74 \uc0c8\ub85c \ubd88\ub7ec\uc624\uae30
  return fail;
}
async function savePost(editId){
  const title = $('wTitle').value.trim();
  const time = $('wTime').value;
  if (!time){ toast('\ub4f1\ub85d \ub0a0\uc9dc\ub97c \uc785\ub825\ud574 \uc8fc\uc138\uc694'); return; }
  if (!title){ toast('\uc81c\ubaa9\uc744 \uc785\ub825\ud574 \uc8fc\uc138\uc694'); return; }
  const target = (document.querySelector('#wTarget .chip.on') || {}).dataset?.v || '\ubaa8\ub450';
  const content = $('wContent').value;
  const files = wFiles.slice();
  const original = !!($('wOrig') && $('wOrig').checked);
  busy(true, '\uc800\uc7a5 \uc911\u2026');
  try {
    let postId = editId, rest = files;
    if (editId){
      S.posts = await api('updatePost', S.me, editId, { title, content, target, time });
    } else {
      // \uc55e 5\uc7a5\uc740 \uac8c\uc2dc\ud310 \uc0ac\uc9c4\uce78(\uc571\uc2dc\ud2b8 \ud638\ud658), \ub098\uba38\uc9c0\ub294 Multi file upload
      const first = original ? [] : files.filter(f => f.kind === 'photo').slice(0, 5);
      const imgs = [];
      for (let i = 0; i < first.length; i++){ busy(true, `\uc0ac\uc9c4 \uc900\ube44 \uc911 ${i+1}/${first.length}`); imgs.push(await shrink(first[i].file, 1600)); }
      busy(true, '\uc77c\uae30 \uc800\uc7a5 \uc911\u2026');
      const r = await api('addPost', S.me, { title, content, target, time, images: imgs,
        totalPhotos: files.filter(f => f.kind === 'photo').length, totalVideos: files.filter(f => f.kind === 'video').length });
      S.posts = r.posts; postId = r.id;
      rest = files.filter(f => !first.includes(f));
      const ct = countText(files.filter(f => f.kind === 'photo').length, files.filter(f => f.kind === 'video').length);
      notifyFamily('\ud83d\udcd6 ' + nameOf(S.me) + '\ub2d8\uc774 \uc0c8 \uc77c\uae30\ub97c \uc62c\ub838\uc5b4\uc694', title + (ct ? ' (' + ct + ')' : ''), 'notebook');
    }
    let fail = 0;
    if (rest.length) fail = await uploadToPost(postId, rest, !!editId, original);
    wFiles = [];
    closeLayer(); if (editId) closeLayer();
    renderFeed(true);
    openPost(postId);
    toast(fail ? `\uc800\uc7a5\ud588\uc5b4\uc694 (\uc2e4\ud328 ${fail}\uac1c)` : '\uc800\uc7a5\ud588\uc5b4\uc694');
  } catch(e){ toast('\uc800\uc7a5 \uc2e4\ud328: ' + errMsg(e)); }
  busy(false);
}
/* \uc77c\uae30 \uc0c1\uc138\ud654\uba74\uc5d0\uc11c \ubc14\ub85c \ucd94\uac00 */
async function addToPost(inp, kind, postId){
  const files = [...(inp.files || [])]; inp.value = '';
  if (!files.length){ alert('\uc120\ud0dd\ub41c \ud30c\uc77c\uc774 \uc5c6\uc5b4\uc694. \ub2e4\uc2dc \uace8\ub77c \uc8fc\uc138\uc694.'); return; }
  const picked = sortPicked(files);
  const list = picked.filter(x => x.kind === 'photo').slice(0, MAX_PHOTOS).concat(picked.filter(x => x.kind === 'video').slice(0, MAX_VIDEOS));
  if (!list.length) return;
  const fail = await uploadToPost(postId, list, true, lsGet('origQ', true));
  busy(false);
  toast(fail ? `\uc62c\ub838\uc5b4\uc694 (\uc2e4\ud328 ${fail}\uac1c)` : `${list.length - fail}\uac1c \uc62c\ub838\uc5b4\uc694`);
  fillPostMedia(postId);
}

function ensureMedia(){
  if (S.media) return Promise.resolve(S.media);
  if (!S.mediaP) S.mediaP = api('getMedia').then(l => (S.media = l)).catch(e => { S.mediaP = null; throw e; });

}
function mediaTarget(m){ const p = S.posts.find(x => x.id === m.postId); return p ? normTarget(p.target) : '\ubaa8\ub450'; }
function albumList(){

    if (S.albumKind === 'photo' && m.video) return false;

    if (S.albumFilter !== '\uc804\uccb4'){ const t = mediaTarget(m); if (t !== S.albumFilter && t !== '\ubaa8\ub450') return false; }
    return true;

function enableZoom(stage, img, go, mv){
  let sc = 1, tx = 0, ty = 0, pinch = null, drag = null, lastTap = 0;
  const MAX = 6;
  const apply = (anim) => { img.style.transition = anim ? 'transform .2s' : 'none'; img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };

    const r = stage.getBoundingClientRect();

    tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty));

  // (cx, cy) \ud654\uba74 \uc88c\ud45c\ub97c \uae30\uc900\uc73c\ub85c \ubc30\uc728 \ubcc0\uacbd
  const zoomAt = (ns, cx, cy, anim) => {
    ns = Math.max(1, Math.min(MAX, ns));

    const px = cx - (r.left + r.width / 2), py = cy - (r.top + r.height / 2);

  const showZoom = () => { const z = mv.querySelector('.zl'); if (z) z.textContent = Math.round(sc * 100) + '%'; };

  // \ud130\uce58
  stage.addEventListener('touchstart', e => {
    if (e.target.closest('.nv')) return;
    if (e.touches.length === 2){
      const [a, b] = e.touches;
      pinch = { d: dist(a, b), sc, cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2 }; drag = null;
    } else if (e.touches.length === 1 && !pinch){
      const t = e.touches[0];
      drag = { x: t.clientX, y: t.clientY, tx, ty, t: Date.now(), moved: false };
    }
  }, { passive: true });
  stage.addEventListener('touchmove', e => {
    if (pinch && e.touches.length === 2){
      e.preventDefault();

      const target = pinch.sc * dist(a, b) / pinch.d;
      zoomAt(target, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    } else if (drag && e.touches.length === 1){
      const t = e.touches[0], dx = t.clientX - drag.x, dy = t.clientY - drag.y;

    }
  }, { passive: false });
  stage.addEventListener('touchend', e => {
    if (pinch){ if (e.touches.length < 2) pinch = null; drag = null; return; }
    if (!drag) return;
    const t = e.changedTouches[0], dx = t.clientX - drag.x, dy = t.clientY - drag.y;
    if (!drag.moved){                              // \ud0ed
      const now = Date.now();
      if (now - lastTap < 300){ zoomAt(sc > 1 ? 1 : 2.5, t.clientX, t.clientY, true); lastTap = 0; }
      else lastTap = now;
    } else if (sc === 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      go(dx < 0 ? 1 : -1);                         // \ub9de\ucda4 \uc0c1\ud0dc\uc5d0\uc11c \uc88c\uc6b0\ub85c \ubc00\uba74 \ub118\uae30\uae30
    }
    drag = null;
  });
  // \ub9c8\uc6b0\uc2a4 (PC)
  stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(sc * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });
  stage.addEventListener('dblclick', e => zoomAt(sc > 1 ? 1 : 2.5, e.clientX, e.clientY, true));
  stage.addEventListener('mousedown', e => {
    if (sc <= 1 || e.target.closest('.nv')) return;
    e.preventDefault();
    const m0 = { x: e.clientX, y: e.clientY, tx, ty };
    const mvH = ev => { tx = m0.tx + ev.clientX - m0.x; ty = m0.ty + ev.clientY - m0.y; clamp(); apply(); };
    const up = () => { window.removeEventListener('mousemove', mvH); window.removeEventListener('mouseup', up); };

  });

  const r = () => stage.getBoundingClientRect();

}

async function giphy(path, q, limit){
  const k = await gifKey();
  const u = 'https://api.giphy.com/v1/' + path + '?api_key=' + encodeURIComponent(k) + '&limit=' + (limit || 24) + '&rating=g&lang=ko' + (q != null ? '&q=' + encodeURIComponent(q) : '');
  const r = await fetch(u); if (!r.ok) throw new Error('GIPHY ' + r.status);
  const j = await r.json();
  return (j.data || []).map(g => ({
    id: g.id, title: g.title || '',
    thumb: (g.images.fixed_width_small || g.images.fixed_width || g.images.downsized || {}).url,
    url: (g.images.fixed_width || g.images.downsized || g.images.original || {}).url,
    kakao: /kakaofriends/i.test((g.username || '') + ' ' + (g.user && g.user.username || '') + ' ' + (g.title || ''))
  })).filter(g => g.thumb && g.url);
}
async function searchGif(q){
  q = (q || '').trim(); S.gif.q = q; S.gif.loading = true; renderGif();
  const en = GIF_KO[q] || '';
  const term = en || q;
  try {
    const jobs = [
      giphy('gifs/search', (KAKAO_GIPHY + ' ' + term).trim(), 30).catch(() => []),
      giphy('stickers/search', (KAKAO_GIPHY + ' ' + term).trim(), 30).catch(() => []),
      giphy('gifs/search', ('kakao friends ' + term).trim(), 24).catch(() => []),
      q ? giphy('gifs/search', term, 30).catch(() => []) : giphy('gifs/trending', null, 30).catch(() => [])
    ];
    if (en && q !== en) jobs.push(giphy('gifs/search', q, 15).catch(() => []));
    const [k1, k2, k3, all, ko] = await Promise.all(jobs);
    const seen = {}, kakao = [], other = [];
    [...k1, ...k2, ...k3.filter(g => g.kakao)].forEach(g => { if (!seen[g.id]){ seen[g.id] = 1; kakao.push(g); } });
    [...(ko || []), ...all, ...k3].forEach(g => { if (!seen[g.id]){ seen[g.id] = 1; (g.kakao ? kakao : other).push(g); } });
    S.gif.kakao = kakao; S.gif.other = other;
  } catch(e){ S.gif.kakao = []; S.gif.other = []; toast('GIF \uac80\uc0c9 \uc2e4\ud328: ' + errMsg(e)); }

  if (!b){ b = document.createElement('i'); b.className = 'nbadge'; btn.appendChild(b); }
  b.textContent = n > 99 ? '99+' : n; b.style.display = n ? '' : 'none';
}
async function loadChats(scroll){
  try {
    const viewing = S.tab === 'chat' && !document.hidden;
    const before = S.chats.length + '|' + (S.chats[S.chats.length-1]||{}).id + '|' + JSON.stringify(S.reads);
    setChats(await api('getChats', S.me, viewing));
    const changed = before !== S.chats.length + '|' + (S.chats[S.chats.length-1]||{}).id + '|' + JSON.stringify(S.reads);
    if ((changed || scroll) && S.tab === 'chat') renderChats(scroll || nearBottom());
  } catch(e){ if (scroll){ showErr('\ucc44\ud305 \ubd88\ub7ec\uc624\uae30', e); if (!S.chats.length) $('chatList').innerHTML = '<div class="empty">\ucc44\ud305\uc744 \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc5b4\uc694</div>'; } }
}
function nearBottom(){ return window.innerHeight + window.scrollY > document.body.scrollHeight - 160; }
// \uc774\ubaa8\uc9c0\ub9cc \uc788\ub294 \uba54\uc2dc\uc9c0\uc778\uc9c0 (\uc624\ub798\ub41c \ube0c\ub77c\uc6b0\uc800\uc5d0\uc11c\ub3c4 \uc624\ub958 \uc548 \ub098\uac8c \ucf54\ub4dc\uac12\uc73c\ub85c \ud310\ubcc4)
function isBigEmo(t){
  if (!t || t.length > 16) return false;
  let n = 0;
  for (const ch of t.replace(/\s/g, '')){
    const c = ch.codePointAt(0);
    if (c === 0x200D || (c >= 0xFE00 && c <= 0xFE0F) || (c >= 0x1F3FB && c <= 0x1F3FF)) continue;   // \uc5f0\uacb0\u00b7\ubcc0\ud615 \ubb38\uc790
    const emo = (c >= 0x1F000 && c <= 0x1FAFF) || (c >= 0x2600 && c <= 0x27BF) || (c >= 0x2B00 && c <= 0x2BFF) ||
                c === 0x2764 || c === 0x2763 || c === 0x203C || c === 0x2049 || (c >= 0x2190 && c <= 0x21FF);
    if (!emo) return false;
    n++;
  }
  return n > 0 && n <= 3;
}
function fileIcon(n){
  const e = (n.split('.').pop() || '').toLowerCase();
  if (/pdf/.test(e)) return ['\ud83d\udcd5','#fde8e8']; if (/xlsx?|csv/.test(e)) return ['\ud83d\udcd7','#e6f6ea'];
  if (/docx?|hwpx?|txt/.test(e)) return ['\ud83d\udcd8','#e7f0fd']; if (/pptx?/.test(e)) return ['\ud83d\udcd9','#fdf0e3'];
  if (/zip|rar|7z/.test(e)) return ['\ud83d\udddc\ufe0f','#eee']; if (/mp3|m4a|wav/.test(e)) return ['\ud83c\udfb5','#f3ecfd'];
  return ['\ud83d\udcc4','#eef2f6'];
}
function fmtSize(b){ if (!b) return ''; if (b < 1024*1024) return Math.max(1, Math.round(b/1024)) + 'KB'; return (b/1024/1024).toFixed(1) + 'MB'; }
function isMedia(m){ return (m.photo || (m.attach && m.attach.kind === 'video')) && !m.text; }

function renderChats(scroll){
  // \uc0ac\uc9c4\u00b7\uc601\uc0c1 \ubaa9\ub85d (\ubdf0\uc5b4\uc6a9)
  const media = []; const midx = {};
  S.chats.forEach(m => {
    if (m.photo){ midx[m.id] = media.length; media.push({ ref: m.photo, id: m.photo.id, time: m.time, video: false }); }
    else if (m.attach && m.attach.kind === 'video'){ midx[m.id] = media.length; media.push({ id: m.attach.id, time: m.time, video: true }); }
  });
  S.viewLists.chat = media;

  // \uac19\uc740 \uc0ac\ub78c\uc774 1\ubd84 \uc548\uc5d0 \uc5f0\ub2ec\uc544 \ubcf4\ub0b8 \uc0ac\uc9c4\u00b7\uc601\uc0c1\uc740 \ud55c \ubb36\uc74c
  const items = [];
  S.chats.forEach(m => {
    const last = items[items.length - 1];
    if (isMedia(m) && last && last.group && last.sender === m.sender && last.time.slice(0,16) === m.time.slice(0,16)) last.ms.push(m);
    else if (isMedia(m)) items.push({ group: true, sender: m.sender, time: m.time, ms: [m] });
    else items.push({ group: false, sender: m.sender, time: m.time, m });
  });

  let lastDay = '', lastWho = '', html = '';
  items.forEach((it, k) => {
    const day = it.time.slice(0,10);
    if (day !== lastDay){ html += `<div class="day">${fmtDate(day)}</div>`; lastDay = day; lastWho = ''; }
    const me = it.sender === S.me;
    const showWho = !me && lastWho !== it.sender; lastWho = it.sender;
    const nx = items[k+1];
    const showTime = !nx || nx.sender !== it.sender || nx.time.slice(0,16) !== it.time.slice(0,16);
    const lastM = it.group ? it.ms[it.ms.length-1] : it.m;
    const unr = (lastM.id === 'tmp') ? S.members.filter(e => e !== S.me).length : unreadCount(lastM);
    let body, id;
    if (it.group){
      const ms = it.ms; id = ms[ms.length-1].id;
      const n = ms.length, cls = n === 1 ? 'n1' : n === 2 ? 'n2' : n === 3 ? 'n3' : n === 4 ? 'n4' : 'nm';
      const shown = ms.slice(0, 9);
      body = `<div class="cimgs ${cls}">` + shown.map((m, j) => {
        const ref = m.photo || { id: m.attach.id };
        const more = (j === 8 && n > 9) ? `<span class="more">+${n-9}</span>` : '';
        return `<div class="ci" onclick="openMedia('chat',${midx[m.id]})"><img data-ref='${esc(JSON.stringify(ref))}' alt="">${m.attach?'<span class="pl">\u25b6</span>':''}${more}</div>`;
      }).join('') + '</div>';
    } else {
      const m = it.m; id = m.id; let parts = '';
      if (m.photo) parts += `<div class="cimgs n1" style="margin-bottom:4px"><div class="ci" onclick="openMedia('chat',${midx[m.id]})"><img data-ref='${esc(JSON.stringify(m.photo))}' alt=""></div></div>`;
      if (m.attach && m.attach.kind === 'video') parts += `<div class="cimgs n1" style="margin-bottom:4px"><div class="ci" onclick="openMedia('chat',${midx[m.id]})"><img data-ref='${esc(JSON.stringify({id:m.attach.id}))}' alt=""><span class="pl">\u25b6</span></div></div>`;
      if (m.attach && m.attach.kind === 'gif' && m.attach.url){
        parts += `<img class="cgif" src="${esc(m.attach.url)}" alt="GIF" loading="lazy">`;
      }
      if (m.attach && m.attach.kind === 'file'){
        const [ic, bg] = fileIcon(m.attach.name);
        parts += `<div class="fcard" onclick="downloadFile('${esc(m.attach.id)}','${esc(m.attach.name).replace(/'/g,'&#39;')}')"><div class="fi" style="background:${bg}">${ic}</div>
          <div style="min-width:0"><div class="fn">${esc(m.attach.name)}</div><div class="fs">${fmtSize(m.attach.size)} \u00b7 \ub20c\ub7ec\uc11c \uc800\uc7a5</div></div></div>`;
      }
      if (m.text) parts += isBigEmo(m.text) ? `<div class="bigemo">${esc(m.text)}</div>` : `<div class="bub">${linkify(m.text)}</div>`;
      body = parts;
    }
    html += `<div class="msg ${me?'me':''}" data-id="${esc(id)}">${!me ? (showWho ? avatarHtml(it.sender) : '<span style="width:36px;flex:none"></span>') : ''}
      <div>${showWho?`<div class="who">${esc(nameOf(it.sender))}</div>`:''}${body}</div>
      ${(showTime || unr) ? `<span class="tm">${unr ? `<b class="unr">${unr}</b>` : ''}${showTime ? ampm(it.time) : ''}</span>` : ''}</div>`;
  });
  html += S.uploads.map(u => `<div class="upl">${u.kind==='video'?'\ud83c\udfac':'\ud83d\udcce'} ${esc(u.name)}<div style="color:var(--sub);font-size:11px;margin-top:2px">${u.msg||('\uc5c5\ub85c\ub4dc \uc911 '+u.pct+'%')}</div><div class="pb"><i style="width:${u.pct}%"></i></div></div>`).join('');
  $('chatList').innerHTML = html || '<div class="empty">\uccab \uba54\uc2dc\uc9c0\ub97c \ubcf4\ub0b4\ubcf4\uc138\uc694</div>';
  hydrate($('chatList'));
  bindLongPress();
  if (scroll) setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30);
}
function ampm(t){ let h = +t.slice(11,13); const mi = t.slice(14,16); const ap = h < 12 ? '\uc624\uc804' : '\uc624\ud6c4'; h = h % 12 || 12; return ap + ' ' + h + ':' + mi; }

/* \uae38\uac8c \ub204\ub974\uae30 \u2192 \ubcf5\uc0ac / \uc0ad\uc81c */
function bindLongPress(){
  $('chatList').querySelectorAll('.msg').forEach(el => {
    let tm;
    const startT = () => { tm = setTimeout(() => msgActions(el.dataset.id), 550); };
    const cancel = () => clearTimeout(tm);
    el.addEventListener('touchstart', startT, { passive: true });
    el.addEventListener('touchend', cancel); el.addEventListener('touchmove', cancel);
    el.addEventListener('contextmenu', e => { e.preventDefault(); msgActions(el.dataset.id); });
  });
}
function msgActions(id){
  const m = S.chats.find(x => x.id === id); if (!m) return;
  const a = document.createElement('div'); a.className = 'acts';
  a.innerHTML = `<div class="box2">${m.text?'<button data-a="copy">\ubcf5\uc0ac</button>':''}
    ${m.sender===S.me?'<button data-a="del" class="dg">\uc0ad\uc81c</button>':''}<button data-a="x">\ucde8\uc18c</button></div>`;
  a.onclick = async e => {
    const act = e.target.dataset.a; a.remove(); if (!act || act === 'x') return;
    if (act === 'copy'){ try { await navigator.clipboard.writeText(m.text); toast('\ubcf5\uc0ac\ud588\uc5b4\uc694'); } catch(_){ toast('\ubcf5\uc0ac\uac00 \uc548 \ub3fc\uc694'); } }
    if (act === 'del' && confirm('\uc774 \uba54\uc2dc\uc9c0\ub97c \uc0ad\uc81c\ud560\uae4c\uc694?')){
      try { setChats(await api('deleteChat', S.me, id)); renderChats(false); } catch(err){ toast(errMsg(err)); }
    }
  };
  document.body.appendChild(a);
}

function startChatPoll(){ stopChatPoll(); S.chatTimer = setInterval(() => { if (!document.hidden && S.tab==='chat' && !S.uploads.length) loadChats(false); }, 5000); }
setInterval(() => { if (S.me && !document.hidden && S.tab !== 'chat' && !$('main').classList.contains('hidden')) loadChats(false); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tab === 'chat') loadChats(false); });
function stopChatPoll(){ if (S.chatTimer) clearInterval(S.chatTimer); S.chatTimer = null; }
function autoGrow(t){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 110) + 'px'; }
function chatKey(e){ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.innerWidth > 700){ e.preventDefault(); sendChatText(); } }
function nowStr(){ return new Date(Date.now()+9*3600000).toISOString().replace('T',' ').slice(0,19); }
async function sendChatText(){
  const t = $('chatText').value.trim(); if (!t) return;
  $('chatText').value = ''; autoGrow($('chatText')); updSend();
  S.chats.push({ id: 'tmp', sender: S.me, text: t, time: nowStr() });
  renderChats(true);
  try { setChats(await api('sendChat', S.me, nameOf(S.me), t, [])); renderChats(true); notifyFamily('\ud83d\udcac ' + nameOf(S.me), t, 'speech_balloon'); }
  catch(e){ toast('\uc804\uc1a1 \uc2e4\ud328: ' + errMsg(e)); S.chats = S.chats.filter(m => m.id !== 'tmp'); renderChats(true); }
}
async function sendPhotos(inp){
  const files = [...inp.files].slice(0, 30); inp.value = ''; if (!files.length) return;
  const u = { name: '\uc0ac\uc9c4 ' + files.length + '\uc7a5', kind: 'photo', pct: 0, msg: '\uc0ac\uc9c4 \uc900\ube44 \uc911\u2026' }; S.uploads.push(u); renderChats(true);
  try {
    const imgs = [];
    for (let i = 0; i < files.length; i++){ imgs.push(await shrink(files[i], 1600)); u.pct = Math.round((i+1)/files.length*50); renderChats(true); }
    u.msg = '\ubcf4\ub0b4\ub294 \uc911\u2026'; renderChats(true);
    // 5\uc7a5\uc529 \ub098\ub220 \ubcf4\ub0b4\uae30
    for (let i = 0; i < imgs.length; i += 5){
      setChats(await api('sendChat', S.me, nameOf(S.me), '', imgs.slice(i, i+5)));
      u.pct = 50 + Math.round(Math.min(imgs.length, i+5) / imgs.length * 50); renderChats(true);
    }
    notifyFamily('\ud83d\udcac ' + nameOf(S.me), '\ud83d\udcf7 \uc0ac\uc9c4 ' + imgs.length + '\uc7a5', 'speech_balloon');
  } catch(e){ toast('\uc0ac\uc9c4 \uc804\uc1a1 \uc2e4\ud328: ' + errMsg(e)); }
  S.uploads = S.uploads.filter(x => x !== u); renderChats(true);
}
function readB64(blob){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); });
}
async function sendBig(inp, kind){
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  if (f.size > MAX_VIDEO_MB*1024*1024){ alert('100MB \uc774\ud558 \ud30c\uc77c\ub9cc \ubcf4\ub0bc \uc218 \uc788\uc5b4\uc694 (' + fmtSize(f.size) + ')'); return; }
  if (!f.size){ alert('\ube48 \ud30c\uc77c\uc774\uc5d0\uc694. \ud3f0\uc5d0 \uc544\uc9c1 \ub0b4\ub824\ubc1b\uc9c0 \uc54a\uc740 \ud074\ub77c\uc6b0\ub4dc \ud30c\uc77c\uc77c \uc218 \uc788\uc5b4\uc694.'); return; }
  const u = { name: f.name, kind, pct: 0 }; S.uploads.push(u); renderChats(true);
  try {
    const id = await uploadBig(f, '', pct => { u.pct = pct; renderChats(true); });
    u.msg = '\ub4f1\ub85d \uc911\u2026'; renderChats(true);
    setChats(await api('sendChatFile', S.me, nameOf(S.me), { id, name: f.name, size: f.size, kind }));
    notifyFamily('\ud83d\udcac ' + nameOf(S.me), kind === 'video' ? '\ud83c\udfac \ub3d9\uc601\uc0c1' : '\ud83d\udcce ' + f.name, 'speech_balloon');
  } catch(e){ toast('\uc804\uc1a1 \uc2e4\ud328: ' + errMsg(e)); }
  S.uploads = S.uploads.filter(x => x !== u); renderChats(true);
}
async function downloadFile(id, name){
  busy(true);
  try {
    const d = await api('getFileData', id);
    if (d.big){ window.open('https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view', '_blank'); }
    else {
      const bin = atob(d.data); const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([arr], { type: d.mime || 'application/octet-stream' }));
      const a = document.createElement('a'); a.href = url; a.download = name || d.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
  } catch(e){ toast('\ubc1b\uae30 \uc2e4\ud328: ' + errMsg(e)); }
  busy(false);
}
